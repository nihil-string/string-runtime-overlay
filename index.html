<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>String 职能与本次设置</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=20260729-1">
</head>
<body>
  <main id="appShell" class="shell" data-view="roles">
    <span id="viewTitle" class="sr-only">职能分配</span>
    <span id="partySummary" class="sr-only">等待小队数据</span>

    <section id="rolesPanel" class="view-panel roles-panel" aria-label="当前职能分配">
      <section class="role-board">
        <div id="roleSlots" class="role-slots"></div>
      </section>

      <div class="role-actions" aria-label="职能分配操作">
        <button id="defaultSortButton" class="icon-button" type="button" title="按职业默认顺序重新分配" aria-label="按职业默认顺序重新分配">
          <img src="./assets/icons/refresh.svg" alt="" aria-hidden="true">
        </button>
        <button id="configTab" class="icon-button settings-button" type="button" title="打开本次设置" aria-label="打开本次设置">
          <img src="./assets/icons/settings.svg" alt="" aria-hidden="true">
          <span id="configTabDot" class="tab-dot" aria-hidden="true"></span>
        </button>
      </div>

      <div class="sr-only" aria-live="polite">
        <span id="statusText">打开 ACT/OverlayPlugin 后会自动读取当前小队。</span>
        <span id="lastBroadcastText">尚未广播</span>
      </div>
    </section>

    <section id="configPanel" class="view-panel config-panel" aria-label="本次设置" hidden>
      <header class="config-header">
        <h1>本次设置</h1>

        <div class="profile-primary" aria-label="当前配置">
          <span class="profile-name">默认配置</span>
        </div>

        <div class="config-connection">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connectionState" class="state state-idle">未连接</span>
        </div>

        <button id="rolesTab" class="back-button" type="button">返回</button>

        <div class="sr-only" aria-live="polite">
          <p id="configHint">可随时修改并保存；进入绝妖星后自动生效。</p>
          <span id="configStateBadge" class="config-state state-waiting">未进本</span>
        </div>
      </header>

      <div class="config-body">
        <nav class="phase-tabs" role="tablist" aria-label="P1 到 P5 设置">
          <button id="phaseTabP1" class="phase-tab active" type="button" role="tab" aria-selected="true" aria-controls="phaseContent" data-phase="p1">P1</button>
          <button id="phaseTabP2" class="phase-tab" type="button" role="tab" aria-selected="false" aria-controls="phaseContent" data-phase="p2">P2</button>
          <button id="phaseTabP3" class="phase-tab" type="button" role="tab" aria-selected="false" aria-controls="phaseContent" data-phase="p3">P3</button>
          <button id="phaseTabP4" class="phase-tab" type="button" role="tab" aria-selected="false" aria-controls="phaseContent" data-phase="p4">P4</button>
          <button id="phaseTabP5" class="phase-tab" type="button" role="tab" aria-selected="false" aria-controls="phaseContent" data-phase="p5">P5</button>
        </nav>

        <div class="config-main">
          <section class="general-card" aria-labelledby="generalTitle">
            <div class="section-heading">
              <h2 id="generalTitle">常用开关</h2>
            </div>
            <div class="general-grid">
              <label class="toggle-row">
                <span><strong>原生绘图</strong><small>String Native 总开关</small></span>
                <input type="checkbox" data-config-key="MyDMU_StringNativeVfx">
              </label>
              <label class="toggle-row">
                <span><strong>个人路线</strong><small>只显示本人的引导</small></span>
                <input type="checkbox" data-config-key="MyDMU_StringNativeVfxPersonalGuide">
              </label>
              <label class="toggle-row">
                <span><strong>自动标点</strong><small>标点功能总开关</small></span>
                <input type="checkbox" data-config-key="MyDMU_AutoMarkV5">
              </label>
              <label class="toggle-row">
                <span><strong>小队消息</strong><small>发送 /p 播报</small></span>
                <input type="checkbox" data-config-key="MyDMU_PartyChatEnabled">
              </label>
            </div>
          </section>

          <div id="phaseContent" class="phase-content" role="tabpanel" aria-live="polite">
            <section class="feature-section marking-section" aria-labelledby="markingTitle">
              <div class="feature-heading">
                <h2 id="markingTitle">标点功能</h2>
                <label class="section-toggle">
                  <span>仅本地标点</span>
                  <input type="checkbox" data-config-key="MyDMU_LocalMarkV3">
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p1">
                <label class="field-row">
                  <span class="field-label"><strong>毒 / 锁链标记</strong><small>按 P1 锁链分组自动标记</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P1PoisonMarkV3">
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p2" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>八轮塔标点</strong><small>按每轮 4 人分组自动标记</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P2TowerMarkV3">
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p3" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>麻将标点</strong><small>使用麻将机制标记场地与分组</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P3MahjongMarkV3">
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>一二三目标标点</strong><small>在目标头顶显示一二三标记</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P3TargetMarkV3">
                </label>
                <div class="field-row priority-row">
                  <span class="field-label"><strong>目标优先级</strong><small>默认同步三个目标；需要时再分别细调</small></span>
                  <div class="priority-editors" data-priority-set>
                    <div class="priority-master" aria-label="三个目标的总优先级">
                      <div class="priority-master-track" aria-label="拖动 T、D、N 调整三个目标"></div>
                      <span class="priority-master-status" aria-live="polite">同步三个目标</span>
                      <button class="priority-details-toggle" type="button" aria-expanded="false">细分</button>
                    </div>
                    <div class="priority-target-details" hidden>
                      <div class="priority-editor" data-priority-editor="MyDMU_P3TargetFirstPriority" aria-label="第一目标优先级">
                        <span class="priority-target-label">第一目标</span>
                        <div class="priority-track"></div>
                        <div class="priority-detail" hidden></div>
                        <input type="hidden" data-config-key="MyDMU_P3TargetFirstPriority">
                      </div>
                      <div class="priority-editor" data-priority-editor="MyDMU_P3TargetSecondPriority" aria-label="第二目标优先级">
                        <span class="priority-target-label">第二目标</span>
                        <div class="priority-track"></div>
                        <div class="priority-detail" hidden></div>
                        <input type="hidden" data-config-key="MyDMU_P3TargetSecondPriority">
                      </div>
                      <div class="priority-editor" data-priority-editor="MyDMU_P3TargetThirdPriority" aria-label="第三目标优先级">
                        <span class="priority-target-label">第三目标</span>
                        <div class="priority-track"></div>
                        <div class="priority-detail" hidden></div>
                        <input type="hidden" data-config-key="MyDMU_P3TargetThirdPriority">
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="feature-phase" data-phase-panel="p4" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>Buff 标点</strong><small>按元素与石化类型自动标记</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P4BuffMarkV3">
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p5" hidden>
                <p class="empty-note">本阶段没有额外标点设置。</p>
              </div>
            </section>

            <section class="feature-section callout-section" aria-labelledby="calloutTitle">
              <div class="feature-heading">
                <h2 id="calloutTitle">播报与提示</h2>
              </div>

              <div class="feature-phase" data-phase-panel="p1">
                <label class="field-row">
                  <span class="field-label"><strong>行动文字提示</strong><small>显示 P1 关键行动信息</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P1Callout">
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p2" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>八轮塔文字提示</strong><small>显示每轮站位与分组信息</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P2TowerCallout">
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>行动文字提示</strong><small>显示 P2 关键行动信息</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P2ActionCallout">
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p3" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>Debuff 文字提示</strong><small>为关键 Debuff 显示文字信息</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P3DebuffCallout">
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>行动文字提示</strong><small>显示 P3 关键行动信息</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P3ActionCallout">
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p4" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>Buff 小队消息</strong><small>向小队发送 Buff 分配信息</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P4BuffChat">
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p5" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>减伤提示</strong><small>显示 P5 关键减伤提醒</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P5MitigationAlert">
                </label>
              </div>
            </section>

            <section class="feature-section drawing-section" aria-labelledby="drawingTitle">
              <div class="feature-heading">
                <h2 id="drawingTitle">绘图与引导</h2>
              </div>

              <div class="feature-phase" data-phase-panel="p1">
                <label class="field-row">
                  <span class="field-label"><strong>P1 原生绘图</strong><small>显示本阶段的原生机制绘图</small></span>
                  <input type="checkbox" data-config-key="MyDMU_StringNativeVfxP1">
                </label>
                <div class="field-row role-order-row">
                  <span class="field-label"><strong>激光 / 四塔职能顺序</strong><small>拖动 T / D / N；点分组调整组内顺序</small></span>
                  <div class="role-order-editor" data-role-order-editor="MyDMU_P1BeamOrder" aria-label="激光和四塔职能顺序">
                    <div class="role-order-track"></div>
                    <div class="role-order-detail" hidden></div>
                    <input type="hidden" data-config-key="MyDMU_P1BeamOrder">
                  </div>
                </div>
                <label class="field-row field-select">
                  <span class="field-label"><strong>二、三连线方案</strong></span>
                  <select data-config-key="MyDMU_P1Line23Strategy">
                    <option value="mt_st">MT 组上 / ST 组下</option>
                    <option value="tank_ranged">T 远上 / 奶近下</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>传送站位方案</strong></span>
                  <select data-config-key="MyDMU_P1TeleportStrategy">
                    <option value="standard">标准站位</option>
                    <option value="sushi_melee">混乱外 / 睡眠内</option>
                  </select>
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p2" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>P2 原生绘图</strong><small>显示本阶段的原生机制绘图</small></span>
                  <input type="checkbox" data-config-key="MyDMU_StringNativeVfxP2">
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>八轮塔快捷方案</strong><small>快捷设置下方两个精确策略轴</small></span>
                  <select id="p2EightTowerPreset">
                    <option value="role_fixed">职能固定</option>
                    <option value="fan_steel">扇左钢右</option>
                    <option value="uptime">职能固定近战优化</option>
                    <option value="custom" disabled>自定义组合（由下方两轴识别）</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>八轮塔闲人左右分组</strong></span>
                  <select data-config-key="MyDMU_P2Pair2222IdleOddMode">
                    <option value="role">TN 左，DPS 右</option>
                    <option value="cone">扇形左，钢铁右</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>八轮塔奇数轮站位</strong></span>
                  <select data-config-key="MyDMU_P2OddStrategy">
                    <option value="original">原版：分摊在两侧</option>
                    <option value="melee">近战优化：分摊在前</option>
                  </select>
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>八轮塔宝宝椅站位</strong><small>使用 U7b v1.0.1 坐标，默认关闭</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P2UseBbyPos">
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>末轮塔后站位</strong></span>
                  <select data-config-key="MyDMU_P2EndTowerStrategy">
                    <option value="north">去 A 点方向</option>
                    <option value="between">去两塔之间</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>异三角绘制范围</strong></span>
                  <select data-config-key="MyDMU_P2TrineDrawMode">
                    <option value="preview">当前和下次预览</option>
                    <option value="current">只画当前一次</option>
                  </select>
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p3" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>P3 原生绘图</strong><small>显示本阶段的原生机制绘图</small></span>
                  <input type="checkbox" data-config-key="MyDMU_StringNativeVfxP3">
                </label>
                <div class="field-row role-order-row">
                  <span class="field-label"><strong>火 Buff 优先级</strong><small>拖动 T / D / N；点分组调整组内顺序</small></span>
                  <div class="role-order-editor" data-role-order-editor="MyDMU_P3FireBuffOrder" aria-label="火 Buff 优先级">
                    <div class="role-order-track"></div>
                    <div class="role-order-detail" hidden></div>
                    <input type="hidden" data-config-key="MyDMU_P3FireBuffOrder">
                  </div>
                </div>
                <label class="field-row field-select">
                  <span class="field-label"><strong>超级跳诱导</strong></span>
                  <select data-config-key="MyDMU_P3SuperJumpBait">
                    <option value="D3">D3 诱导</option>
                    <option value="D4">D4 诱导</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>击退站位方案</strong></span>
                  <select data-config-key="MyDMU_P3KnockbackStrategy">
                    <option value="thht">THHT 站位</option>
                    <option value="hth">HTH 站位</option>
                    <option value="all">8 人一起</option>
                  </select>
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>响亮亮耳光范围绘图</strong><small>显示职业分区范围提示</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P3SlapRoleSectors">
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>响亮亮耳光站位箭头</strong><small>显示个人站位引导箭头</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P3SlapRouteArrow">
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>一运攻击 1 双线预引导</strong></span>
                  <input type="checkbox" data-config-key="MyDMU_P3Attack1DoubleTether">
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>二运止步 2 双线预引导</strong></span>
                  <input type="checkbox" data-config-key="MyDMU_P3Stop2DoubleTether">
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>踩塔方案</strong></span>
                  <select data-config-key="MyDMU_P3TowerStrategy">
                    <option value="nocchh">CCHH</option>
                    <option value="daohuo">盗火站位</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>踩塔 12 点</strong></span>
                  <select data-config-key="MyDMU_P3TowerHeading">
                    <option value="heel">脚跟方向（Boss 背后）</option>
                    <option value="toe">脚尖方向（Boss 面前）</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>踩塔左右基准</strong></span>
                  <select data-config-key="MyDMU_P3TowerFrame">
                    <option value="boss">面基（Boss 相对）</option>
                    <option value="arena">场基（场地相对）</option>
                  </select>
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p4" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>P4 原生绘图</strong><small>显示本阶段的原生机制绘图</small></span>
                  <input type="checkbox" data-config-key="MyDMU_StringNativeVfxP4">
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>元素散开方案</strong></span>
                  <select data-config-key="MyDMU_P4ElementSpreadStrategy">
                    <option value="d_left">D 左 / TH 右</option>
                    <option value="tn_left">TH 左 / D 右</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>眼睛引导方案</strong></span>
                  <select data-config-key="MyDMU_P4EyeStrategy">
                    <option value="fixed">盗火固定式</option>
                    <option value="eyes_in">眼进，人群出</option>
                    <option value="crowd_static">眼动，人群前后</option>
                    <option value="off">关闭个人站位引导</option>
                  </select>
                </label>
              </div>

              <div class="feature-phase" data-phase-panel="p5" hidden>
                <label class="field-row">
                  <span class="field-label"><strong>P5 原生绘图</strong><small>显示本阶段的原生机制绘图</small></span>
                  <input type="checkbox" data-config-key="MyDMU_StringNativeVfxP5">
                </label>
                <div class="field-row role-order-row">
                  <span class="field-label"><strong>交响曲八方职能顺序</strong><small>从 C（下）开始逆时针；点分组细调</small></span>
                  <div class="role-order-editor" data-role-order-editor="MyDMU_P5SymphonyOrder" aria-label="交响曲八方职能顺序">
                    <div class="role-order-track"></div>
                    <div class="role-order-detail" hidden></div>
                    <input type="hidden" data-config-key="MyDMU_P5SymphonyOrder">
                  </div>
                </div>
                <label class="field-row field-select">
                  <span class="field-label"><strong>地火预显数量</strong><small>控制提前显示的连续地火枚数</small></span>
                  <select data-config-key="MyDMU_P5GroundFireCount">
                    <option value="0">不预显</option>
                    <option value="1">预显 1 枚</option>
                    <option value="2">预显 2 枚</option>
                    <option value="3">预显 3 枚</option>
                    <option value="4">预显 4 枚</option>
                    <option value="5">预显 5 枚</option>
                    <option value="6">预显 6 枚</option>
                    <option value="7">预显完整 7 枚</option>
                  </select>
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>地火两步法个人引导</strong><small>危险圆始终独立绘制</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P5GroundFireGuideEnabled">
                </label>
                <label class="field-row">
                  <span class="field-label"><strong>遗弃末世个人引导</strong><small>需同时开启总开关、P5 与个人路线</small></span>
                  <input type="checkbox" data-config-key="MyDMU_P5ForsakenGuideEnabled">
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>遗弃末世起始方向</strong><small>第 1 波站位，后续每波顺时针旋转</small></span>
                  <select data-config-key="MyDMU_P5ForsakenStart">
                    <option value="1">左下：4</option>
                    <option value="2">右下：3</option>
                    <option value="3">右上：2</option>
                    <option value="4">左上：1</option>
                  </select>
                </label>
                <label class="field-row field-select">
                  <span class="field-label"><strong>疯狂交响曲站位</strong></span>
                  <select data-config-key="MyDMU_P5SymphonySpreadScheme">
                    <option value="regular">常规八方</option>
                    <option value="leaning">斜米站位</option>
                  </select>
                </label>
              </div>
            </section>
          </div>
        </div>
      </div>

      <footer class="config-actions">
        <div class="config-save-state">
          <span class="memory-dot" aria-hidden="true"></span>
          <span id="profileMemoryState">修改会自动记忆</span>
          <span id="dirtyState">尚未修改</span>
          <small id="configError"></small>
        </div>
